(()=>{
'use strict';
const $=id=>document.getElementById(id),storageKey='sudoku-adventure-players-v1',activeKey='sudoku-adventure-active-v1';
const labels={easy:'ง่าย',medium:'ปานกลาง',hard:'ยาก'},rewards={easy:10,medium:20,hard:30},holes={easy:35,medium:44,hard:50};
const skins=[
{id:'classic',name:'Classic White',price:0,colors:['#f7f8fa','#ffffff','#d9dce2','#69707b','#505761','#343940','#f1f3f6','#e6e9ed','#dde5ed','#e5f4e9','#276747','#fbe6eb','#a13e58','#f2f3f5','#8395ad55']},
{id:'lavender',name:'Lavender Dream',price:30,colors:['#f0ecfa','#fdfbff','#d7cbea','#8066ba','#70529e','#3d315b','#f3edfb','#e9dff8','#ded0f4','#e4f3e9','#29694b','#fae5ed','#a33f65','#eee7fa','#9571ca66']},

{id:'sakura',name:'Sakura Pink',price:50,colors:['#fff0f4','#fffafd','#efcbd8','#cb7097','#ae527e','#543445','#fff0f5','#f9dfe9','#f4cddf','#e2f2e7','#286747','#fbe0e7','#a53557','#ffedf3','#dd90ad66']},

{id:'midnight',name:'Midnight Dark',price:100,colors:['#172330','#263443','#45576b','#83b9dc','#c3e3f7','#ecf5ff','#314454','#395d76','#416b87','#254c42','#c0f3dc','#613c50','#ffd3df','#314357','#77c9ff88']},
{id:'galaxy',name:'Galaxy Purple',price:100,colors:['#261c3e','#302442','#68518c','#b793f2','#e5d4ff','#f7efff','#47315e','#5b3c79','#68498b','#31544b','#d5ffe7','#6b3c59','#ffd6e7','#3e3056','#b69cff88']},

];
const props=['--stage','--cell','--line','--accent','--digit','--given','--peer','--same','--selected','--correct','--correct-ink','--wrong','--wrong-ink','--pad','--glow'];

let players={},player=null,playerKey='',currentView='intro',solution=[],values=[],givens=[],selected=-1,hearts=3,seconds=0,timerId=null,difficulty='easy',status='idle',completed=new Set(),roundRecorded=false,roundId='',toastId=null,messageId=null,confirmAction=null,previewSkin=null,audioContext=null;

function sound(notes,type='sine'){if(!player?.sound)return;try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();let now=audioContext.currentTime;for(const [freq,duration] of notes){const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.075,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+duration+.01);now+=duration*.83}}catch{}}

function paint(el,skin){el.dataset.skin=skin.id;props.forEach((name,i)=>el.style.setProperty(name,skin.colors[i]))}

function updateIdentity(){const identity=`${player.name} · ${player.classroom} · เลขที่ ${player.number}`;$('home-identity').textContent=identity;$('game-identity').textContent=identity;$('home-points').textContent=`✦ ${player.points} แต้ม`;$('game-points').textContent=`${player.points} แต้ม`;$('home-skin').textContent=`◈ ${skinFor(player.skin).name}`;$('shop-balance').textContent=`✦ ${player.points} แต้ม`;document.body.classList.toggle('no-animations',player.animation===false)}
function show(view){if(currentView==='game'&&view!=='game')stopTimer();document.querySelectorAll('.view').forEach(el=>el.hidden=el.id!==view);currentView=view;if(player){updateIdentity();applySkin();if(view==='shop')renderShop();if(view==='history')renderHistory();if(view==='settings'){$('sound-toggle').checked=player.sound!==false;$('animation-toggle').checked=player.animation!==false}}window.scrollTo({top:0,behavior:'smooth'})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeSolution(){const digit=shuffle([1,2,3,4,5,6,7,8,9]),rows=shuffle([0,1,2]).flatMap(g=>shuffle([0,1,2]).map(n=>g*3+n)),cols=shuffle([0,1,2]).flatMap(g=>shuffle([0,1,2]).map(n=>g*3+n));return rows.flatMap(r=>cols.map(c=>digit[(r*3+Math.floor(r/3)+c)%9]))}
function countSolutions(grid,limit=2){let best=-1,options=null;for(let i=0;i<81;i++){if(grid[i])continue;const r=Math.floor(i/9),c=i%9,used=new Set();for(let n=0;n<9;n++){used.add(grid[r*9+n]);used.add(grid[n*9+c]);used.add(grid[(Math.floor(r/3)*3+Math.floor(n/3))*9+Math.floor(c/3)*3+n%3])}const possible=[];for(let v=1;v<=9;v++)if(!used.has(v))possible.push(v);if(!possible.length)return 0;if(!options||possible.length<options.length){best=i;options=possible;if(options.length===1)break}}if(best<0)return 1;let total=0;for(const v of options){grid[best]=v;total+=countSolutions(grid,limit-total);grid[best]=0;if(total>=limit)return total}return total}
function makePuzzle(level){for(let attempt=0;attempt<9;attempt++){const answer=makeSolution(),puzzle=answer.slice();let removed=0;for(const i of shuffle(Array.from({length:81},(_,n)=>n))){if(removed>=holes[level])break;puzzle[i]=0;if(countSolutions(puzzle.slice())===1)removed++;else puzzle[i]=answer[i]}if(removed===holes[level])return{answer,puzzle}}return null}
function stopTimer(){clearInterval(timerId);timerId=null}function timeText(s){return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function resetEffects(){clearTimeout(messageId);$('board-message').hidden=true;$('game-over').hidden=true;$('victory').hidden=true;$('particles').replaceChildren();$('board').classList.remove('dim','victory-glow')}
function renderHearts(){const heartsEl=$('hearts');const previous=heartsEl.textContent;heartsEl.textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);heartsEl.style.color='#d77792';heartsEl.classList.add('hearts-pulse');if(previous&&previous!==heartsEl.textContent){heartsEl.classList.remove('heart-loss');void heartsEl.offsetWidth;heartsEl.classList.add('heart-loss')}}
function updateNumpad(){for(const button of $('numpad').children){const number=Number(button.dataset.number),complete=values.filter(value=>value===number).length>=9;button.classList.remove('number-complete','number-return');if(complete){button.classList.add('number-complete');clearTimeout(button._hideTimer);button._hideTimer=setTimeout(()=>{button.hidden=true},480)}else{const wasHidden=button.hidden;clearTimeout(button._hideTimer);button.hidden=false;if(wasHidden)button.classList.add('number-return')}}}
function updateDifficulty(){$('difficulty-value').textContent=labels[difficulty];document.querySelectorAll('[data-difficulty]').forEach(btn=>{const active=btn.dataset.difficulty===difficulty;btn.setAttribute('aria-pressed',String(active));btn.style.background=active?'#7776d9':'#eeedfa';btn.style.color=active?'#fff':'#54529c'})}
function refreshHighlight(){const cells=$('board').children,value=selected>=0?values[selected]:0;for(let i=0;i<cells.length;i++){const cell=cells[i];cell.classList.toggle('peer',selected>=0&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9)&&i!==selected);cell.classList.toggle('same',Boolean(value&&values[i]===value&&i!==selected));cell.classList.toggle('selected',i===selected)}}
function renderBoard(){const frag=document.createDocumentFragment();values.forEach((v,i)=>{const cell=document.createElement('button');cell.type='button';cell.className='cell'+(givens[i]?' given':v?' correct':'');cell.dataset.index=i;cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',`แถว ${Math.floor(i/9)+1} คอลัมน์ ${i%9+1}${v?' เลข '+v:' ว่าง'}`);cell.textContent=v||'';cell.addEventListener('click',()=>select(i));frag.append(cell)});$('board').replaceChildren(frag);refreshHighlight();updateNumpad()}
function select(i){if(status!=='playing')return;selected=i;refreshHighlight()}
function startGame(level=difficulty){stopTimer();resetEffects();const puzzle=makePuzzle(level);if(!puzzle){toast('สร้างโจทย์ไม่สำเร็จ กรุณาลองใหม่');return}difficulty=level;solution=puzzle.answer;values=puzzle.puzzle.slice();givens=puzzle.puzzle.map(Boolean);selected=-1;hearts=3;seconds=0;status='playing';completed.clear();roundId=crypto.randomUUID?.()||String(Date.now()+Math.random());roundRecorded=false;$('timer').textContent='00:00';renderHearts();renderBoard();updateDifficulty();show('game');timerId=setInterval(()=>{if(status==='playing')$('timer').textContent=timeText(++seconds)},1000)}
function boardMessage(text,ms=1000){clearTimeout(messageId);$('board-message').textContent=text;$('board-message').hidden=false;messageId=setTimeout(()=>$('board-message').hidden=true,ms)}
function confetti(){if(player.animation===false)return;const colors=['#e58a9b','#a9c9ef','#a9a6e8','#e8c989','#83c9a5'];for(let i=0;i<65;i++){const dot=document.createElement('span');dot.className='particle';dot.style.setProperty('--x',`${Math.random()*100}%`);dot.style.setProperty('--c',colors[i%colors.length]);dot.style.setProperty('--t',`${1.8+Math.random()*2}s`);dot.style.setProperty('--dx',`${(Math.random()-.5)*130}px`);dot.style.animationDelay=`${Math.random()*.8}s`;$('particles').append(dot);setTimeout(()=>dot.remove(),5000)}}
function checkGroups(i){const row=Math.floor(i/9),col=i%9,box=Math.floor(row/3)*3+Math.floor(col/3);const groups=[['r'+row,Array.from({length:9},(_,n)=>row*9+n)],['c'+col,Array.from({length:9},(_,n)=>n*9+col)],['b'+box,Array.from({length:9},(_,n)=>(Math.floor(row/3)*3+Math.floor(n/3))*9+Math.floor(col/3)*3+n%3)]];let fresh=false;for(const [key,indices] of groups){if(completed.has(key)||!indices.every(j=>values[j]===solution[j]))continue;completed.add(key);fresh=true;indices.forEach(j=>{const cell=$('board').children[j];cell.classList.remove('complete');void cell.offsetWidth;cell.classList.add('complete');setTimeout(()=>cell.classList.remove('complete'),1250)})}if(fresh){boardMessage('PERFECT!',1400);sound([[523,.1],[659,.1],[784,.16]])}}
function enterNumber(n){if(status!=='playing'||selected<0||givens[selected]||values[selected])return;const i=selected,cell=$('board').children[i];if(n===solution[i]){values[i]=n;cell.textContent=String(n);cell.classList.add('correct','pop');cell.setAttribute('aria-label',`แถว ${Math.floor(i/9)+1} คอลัมน์ ${i%9+1} เลข ${n} ถูกต้อง`);refreshHighlight();updateNumpad();setTimeout(()=>cell.classList.remove('pop'),420);sound([[660,.08],[880,.14]]);if(values.every((v,j)=>v===solution[j])){finish(true);return}checkGroups(i)}else{hearts--;renderHearts();cell.textContent=String(n);cell.classList.add('wrong');boardMessage('ตัวเลขไม่ถูกต้อง',1100);sound([[290,.16],[240,.22]],'triangle');setTimeout(()=>{cell.classList.remove('wrong');if(!values[i])cell.textContent=''},420);if(hearts===0)finish(false)}}
function finish(won){if(status!=='playing')return;status=won?'won':'lost';stopTimer();clearTimeout(messageId);$('board-message').hidden=true;const earned=won?rewards[difficulty]+5:0;if(!roundRecorded){roundRecorded=true;player.history ||= [];player.history.unshift({id:roundId,won,difficulty,time:seconds,points:earned,date:new Date().toISOString()});if(won)player.points+=earned;save()}updateIdentity();if(won){$('board').classList.add('victory-glow');$('victory-summary').textContent=`เวลา ${timeText(seconds)} · ${labels[difficulty]} · หัวใจ ${hearts} ดวง`;$('victory-points').textContent=`+${earned} แต้ม`;$('victory').hidden=false;confetti();sound([[523,.12],[659,.12],[784,.12],[1046,.25]])}else{$('board').classList.add('dim');$('encouragement').textContent='ไม่เป็นไรนะ ลองอีกครั้ง คุณทำได้!';$('game-over').hidden=false;sound([[370,.2],[300,.25],[245,.35]],'triangle')}}
function miniBoard(){const board=document.createElement('div');board.className='mini-board';sampleNums.forEach(v=>{const cell=document.createElement('span');cell.className='mini-cell';cell.textContent=v;board.append(cell)});return board}
function skinAction(s){if(!player.owned.includes(s.id)){if(player.points<s.price){toast('แต้มไม่เพียงพอสำหรับสกินนี้');return}player.points-=s.price;player.owned.push(s.id);toast(`ซื้อ ${s.name} สำเร็จ!`)}player.skin=s.id;save();applySkin();updateIdentity();renderShop();if(!$('preview-modal').hidden){showPreview(s)}sound([[580,.12],[800,.18]])}
function actionLabel(s){return player.skin===s.id?'SELECTED':player.owned.includes(s.id)?'เลือกใช้':`ซื้อ ${s.price} แต้ม`}
function showPreview(s){previewSkin=s;$('preview-heading').textContent=s.name;$('preview-price').textContent=s.price?`✦ ${s.price} แต้ม`:'✦ ฟรี';const stage=$('preview-stage');paint(stage,s);stage.replaceChildren(miniBoard());$('preview-action').textContent=actionLabel(s);$('preview-action').disabled=player.skin===s.id;$('preview-modal').hidden=false;$('preview-close').focus()}
function closePreview(){$('preview-modal').hidden=true;previewSkin=null}
function renderShop(){const list=$('skin-list');list.replaceChildren();skins.forEach(s=>{const card=$('shop-card-template').content.firstElementChild.cloneNode(true),frame=card.querySelector('.mini-frame');paint(frame,s);frame.append(miniBoard());card.querySelector('h2').textContent=s.name;card.querySelector('.shop-status').textContent=player.skin===s.id?'SELECTED':player.owned.includes(s.id)?'OWNED':'';card.querySelector('p').textContent=s.price?`✦ ${s.price} แต้ม`:'✦ ฟรี';card.querySelector('.preview-button').addEventListener('click',()=>showPreview(s));const action=card.querySelector('.action-button');action.textContent=actionLabel(s);action.disabled=player.skin===s.id;action.addEventListener('click',()=>skinAction(s));list.append(card)})}
function renderHistory(){const records=player.history||[],wins=records.filter(r=>r.won).length;$('history-stats').textContent=`เล่นทั้งหมด ${records.length} รอบ · ชนะ ${wins} รอบ · แพ้ ${records.length-wins} รอบ`;const list=$('history-list');list.replaceChildren();if(!records.length){const p=document.createElement('p');p.className='card p-6 text-center';p.textContent='ยังไม่มีประวัติการเล่น';list.append(p);return}records.forEach(r=>{const item=document.createElement('article');item.className='card p-4 flex justify-between items-center gap-3 flex-wrap';const left=document.createElement('div'),title=document.createElement('h2'),date=document.createElement('p'),points=document.createElement('strong');title.className='font-medium';title.textContent=`${r.won?'✦ ชนะ':'♡ แพ้'} · ${labels[r.difficulty]||r.difficulty}`;date.className='text-sm text-[#85859b]';date.textContent=`${timeText(r.time)} · ${new Date(r.date).toLocaleDateString('th-TH')}`;points.textContent=`+${r.points} แต้ม`;left.append(title,date);item.append(left,points);list.append(item)})}
function ask(action){confirmAction=action;$('confirm-modal').hidden=false;$('confirm-cancel').focus()}
$('intro-start').addEventListener('click',()=>show('register'));
$('login-back').addEventListener('click',()=>show('intro'));
$('register-form').addEventListener('submit',e=>{e.preventDefault();const name=$('player-name').value.trim().replace(/\s+/g,' '),classroom=$('player-class').value.trim().replace(/\s+/g,' '),number=$('player-number').value.trim();if(!name||!classroom||!number){toast('กรุณากรอกข้อมูลให้ครบ');return}playerKey=JSON.stringify([name.toLocaleLowerCase('th'),classroom.toLocaleLowerCase('th'),number]);player=players[playerKey]||{name,classroom,number,points:0,owned:['classic'],skin:'classic',history:[],sound:true,animation:true};player.owned=Array.isArray(player.owned)?player.owned:['classic'];if(!player.owned.includes('classic'))player.owned.push('classic');player.history ||= [];player.points ||= 0;save();show('home')});
document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{const page=btn.dataset.page;if(page==='game'){if(status==='playing')show('game');else startGame();return}show(page)}));
$('logout').addEventListener('click',()=>{stopTimer();resetEffects();status='idle';player=null;playerKey='';try{localStorage.removeItem(activeKey)}catch{}$('register-form').reset();show('intro')});
document.querySelectorAll('[data-difficulty]').forEach(btn=>btn.addEventListener('click',()=>{const level=btn.dataset.difficulty;if(level===difficulty&&status==='playing')return;if(status==='playing')ask(()=>startGame(level));else startGame(level)}));
$('restart').addEventListener('click',()=>status==='playing'?ask(()=>startGame()):startGame());$('over-retry').addEventListener('click',()=>startGame());$('victory-retry').addEventListener('click',()=>startGame());
$('confirm-cancel').addEventListener('click',()=>{$('confirm-modal').hidden=true;confirmAction=null});$('confirm-yes').addEventListener('click',()=>{$('confirm-modal').hidden=true;const action=confirmAction;confirmAction=null;action?.()});
$('erase').addEventListener('click',()=>{if(status!=='playing')return;if(selected<0){toast('เลือกช่องว่างก่อน');return}if(values[selected]||givens[selected]){toast('ช่องที่ตอบถูกแล้วจะถูกล็อก');return}$('board').children[selected].textContent=''});
$('check').addEventListener('click',()=>{if(status==='playing')toast(`เติมถูกแล้ว ${values.filter((v,i)=>v&&!givens[i]).length} ช่อง · เหลือ ${values.filter(v=>!v).length} ช่อง`)});
for(let n=1;n<=9;n++){const button=document.createElement('button');button.type='button';button.dataset.number=String(n);button.textContent=String(n);button.setAttribute('aria-label',`ใส่เลข ${n}`);button.addEventListener('click',()=>enterNumber(n));$('numpad').append(button)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('preview-modal').hidden){closePreview();return}if(currentView!=='game'||status!=='playing'||!$('confirm-modal').hidden||!$('preview-modal').hidden)return;if(e.target instanceof HTMLInputElement)return;if(/^[1-9]$/.test(e.key)){enterNumber(Number(e.key));return}if(e.key==='Backspace'||e.key==='Delete'){$('erase').click();e.preventDefault();return}if(selected>=0&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const delta={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];select(Math.max(0,Math.min(80,selected+delta)))}});$('preview-close').addEventListener('click',closePreview);$('preview-modal').addEventListener('click',e=>{if(e.target===$('preview-modal'))closePreview()});$('preview-action').addEventListener('click',()=>{if(previewSkin)skinAction(previewSkin)});
$('sound-toggle').addEventListener('change',e=>{player.sound=e.target.checked;save();if(player.sound)sound([[660,.12]])});$('animation-toggle').addEventListener('change',e=>{player.animation=e.target.checked;save();updateIdentity()});
sampleNums.forEach(v=>{const span=document.createElement('span');span.textContent=v;$('sample').append(span)});
players=read(storageKey,{});let remembered=null;try{remembered=localStorage.getItem(activeKey)}catch{}if(remembered&&players[remembered]){playerKey=remembered;player=players[remembered];player.owned ||= ['classic'];player.history ||= [];show('home')}else show('intro');
})();
</script>
 </body>
